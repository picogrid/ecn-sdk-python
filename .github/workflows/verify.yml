name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_VERSION: "0.7.20"

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} source suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js for the Python API typing gate
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install the locked Python API typing toolchain
        if: matrix.python-version == '3.11'
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Check generated Python reference and source typing
        if: matrix.python-version == '3.11'
        run: |
          make check-reference
          uv run --frozen python -m scripts.verify_types --source

      - name: Run the complete source suite
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: >-
          uv run --frozen --isolated --python "$PYTHON_VERSION"
          pytest -p no:cacheprovider tests

  dependency-lock-consistency:
    name: Dependency lock consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check generated dependency locks and release policy
        run: make check-deps

  license-policy:
    name: License policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check repository license policy
        run: make check-license

  exact-release-build:
    name: Build exact release artifacts
    needs: python-tests
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/build-ecn-sdk-release.yml

  exact-release-gate:
    name: Exact release artifact
    if: always()
    needs: exact-release-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful exact artifact verification
        env:
          BUILD_RESULT: ${{ needs.exact-release-build.result }}
        run: test "$BUILD_RESULT" = success
