name: Container Scan

# Scan-only: builds the operator-app image and scans operating-system, base-layer,
# and language-package CVEs with Trivy. It does not push, log in to a registry, or
# sign the image.

on:
  pull_request:
    paths:
      - operator-app/**
      - pyproject.toml
      - src/**
      - uv.lock
      - .github/workflows/container-scan.yml
      - scripts/scan_container_image.py
  push:
    branches:
      - main
    paths:
      - operator-app/**
      - pyproject.toml
      - src/**
      - uv.lock
      - .github/workflows/container-scan.yml
      - scripts/scan_container_image.py
  schedule:
    - cron: "23 7 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/build-ecn-sdk-operator.yml
