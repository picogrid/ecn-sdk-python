# Authored in picogrid/.github; SDK copies are generated by scripts/export-ecn-sdk-workflows.py.
name: Build and verify exact ECN SDK release artifacts

on:
  workflow_call:
    inputs:
      release:
        description: Bind the candidate to the resolved release identity.
        type: boolean
        default: false
      source-ref:
        description: Exact resolved release commit; defaults to the event commit.
        type: string
        default: ""
      release-tag:
        description: Resolved release tag used by the verifier and candidate artifact.
        type: string
        default: ""

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_VERSION: "0.7.20"

jobs:
  build-and-verify:
    runs-on: ${{ (github.repository != 'picogrid/ecn-sdk-python' || github.ref == 'refs/heads/main') && vars.HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      PLAYWRIGHT_WORKERS: ${{ (!inputs.release || ((github.repository != 'picogrid/ecn-sdk-python' || github.ref == 'refs/heads/main') && vars.HEAVY_RUNNER)) && '4' || '1' }}
      VERIFY_RELEASE_JOBS: ${{ (github.repository != 'picogrid/ecn-sdk-python' || github.ref == 'refs/heads/main') && vars.HEAVY_RUNNER && '4' || '1' }}
      LEGION_DOCS_URL: ${{ vars.LEGION_DOCS_URL }}
      LEGION_DOCS_VERSION: ${{ vars.LEGION_DOCS_VERSION }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Prepare the image scan evidence directory
        run: |
          report_directory="$(mktemp -d "$RUNNER_TEMP/container-image-scan.XXXXXX")"
          echo "CONTAINER_SCAN_REPORT_DIRECTORY=$report_directory" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Make Python 3.14 available to the advertised-runtime gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Make Python 3.13 available to the advertised-runtime gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Make Python 3.12 available to the advertised-runtime gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Select Python 3.11 for the canonical verifier
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js for documentation and operator-app gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            operator-app/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install checksum-pinned Trivy 0.69.3
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64)
              asset=trivy_0.69.3_Linux-64bit.tar.gz
              expected_sha=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
              ;;
            ARM64)
              asset=trivy_0.69.3_Linux-ARM64.tar.gz
              expected_sha=7e3924a974e912e57b4a99f65ece7931f8079584dae12eb7845024f97087bdfd
              ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          install_directory="$(mktemp -d "$RUNNER_TEMP/trivy.XXXXXX")"
          archive="$install_directory/trivy.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/$asset" \
            --output "$archive"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$install_directory" trivy
          chmod 0755 "$install_directory/trivy"
          echo "$install_directory" >> "$GITHUB_PATH"

      - name: Bind reproducible output to the released commit
        if: inputs.release
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Verify the three exact distribution artifacts
        run: make verify-release

      - name: Preserve complete verifier image scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.release && 'container-image-scan-release' || 'container-image-scan-verify' }}
          path: |
            ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.scan.json
            ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload verifier image SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.sarif
          category: ${{ inputs.release && 'container-image-release' || 'container-image-verify' }}

      - name: Preserve only the verified candidate and sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.release && format('release-candidate-{0}', inputs.release-tag) || format('verified-release-candidate-{0}', github.sha) }}
          path: |
            dist/
            reports/generated/
            site-dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
