name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-pins:
    name: Workflow actions are immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject mutable action references
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@46cfe808a5f1588656ef299eedd0ce2fd7ec0dcc # v5.0.6

      # A workflow can be valid YAML with a run block the shell cannot parse.
      # The deploy step is the worst place to discover that: it aborts after
      # the Worker is live, publishing a version the smoke never checked.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check that workflow run blocks are valid shell
        run: uv run --no-project --with 'pyyaml==6.0.3' python scripts/check_workflow_shell.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          show-openssf-scorecard: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out reviewed Semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
          path: .semgrep-rules
          sparse-checkout: |
            javascript
            problem-based-packs
            python
            typescript
          persist-credentials: false

      - name: Scan Python and web sources
        run: |
          rule_arguments=()
          rule_count=0
          while IFS= read -r rule_path; do
            case "$rule_path" in
              ""|\#*) continue ;;
            esac
            test -f "$GITHUB_WORKSPACE/.semgrep-rules/$rule_path"
            rule_arguments+=(--config "/rules/$rule_path")
            rule_count=$((rule_count + 1))
          done < .github/workflows/semgrep-rules.txt
          test "$rule_count" -eq 220
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$GITHUB_WORKSPACE/.semgrep-rules:/rules:ro" \
            --workdir /src \
            semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan \
            "${rule_arguments[@]}" \
            --error \
            --metrics=off \
            --exclude .semgrep-rules \
            --exclude docs/node_modules \
            --exclude site-dist \
            .

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for credentials
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          version: "3.96.0"
          # Lob is excluded because the repository has no Lob integration and the
          # detector false-verifies on pytest function names such as
          # test_clock_detects_local_wall_clock_step (a test_-prefixed identifier).
          extra_args: --results=verified,unknown --exclude-detectors=lob

  osv:
    name: OSV scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfiles against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            --output=results.sarif
            --format=sarif
            ./
        continue-on-error: true

      - name: Upload OSV results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: results.sarif
          category: osv

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          online-audits: false
