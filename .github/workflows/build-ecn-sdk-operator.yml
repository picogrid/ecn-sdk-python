# Authored in picogrid/.github; SDK copies are generated by scripts/export-ecn-sdk-workflows.py.
name: Build ECN SDK operator image

on:
  workflow_call:

permissions: {}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Prepare the image scan evidence directory
        run: |
          report_directory="$(mktemp -d "$RUNNER_TEMP/container-image-scan.XXXXXX")"
          echo "CONTAINER_SCAN_REPORT_DIRECTORY=$report_directory" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js for the embedded operator frontend
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: operator-app/package-lock.json

      - name: Build matching SDK client and operator wheels
        run: |
          uv build --wheel --out-dir operator-app/wheelhouse
          uv build --wheel --out-dir operator-app/wheelhouse operator-app
          mapfile -t client_wheels < <(find operator-app/wheelhouse -maxdepth 1 -type f -name 'picogrid_ecn_client-*.whl' -print | sort)
          mapfile -t operator_wheels < <(find operator-app/wheelhouse -maxdepth 1 -type f -name 'picogrid_ecn_operator_app-*.whl' -print | sort)
          test "${#client_wheels[@]}" -eq 1
          test "${#operator_wheels[@]}" -eq 1
          test "$(find operator-app/wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 2
          echo "CLIENT_WHEEL=$(basename "${client_wheels[0]}")" >> "$GITHUB_ENV"
          echo "OPERATOR_WHEEL=$(basename "${operator_wheels[0]}")" >> "$GITHUB_ENV"

      - name: Build operator-app image
        run: |
          docker build \
            -t ecn-operator-app:scan \
            --build-arg CLIENT_WHEEL="${CLIENT_WHEEL}" \
            --build-arg OPERATOR_WHEEL="${OPERATOR_WHEEL}" \
            operator-app

      - name: Install checksum-pinned Trivy 0.69.3
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64)
              asset=trivy_0.69.3_Linux-64bit.tar.gz
              expected_sha=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
              ;;
            ARM64)
              asset=trivy_0.69.3_Linux-ARM64.tar.gz
              expected_sha=7e3924a974e912e57b4a99f65ece7931f8079584dae12eb7845024f97087bdfd
              ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          install_directory="$(mktemp -d "$RUNNER_TEMP/trivy.XXXXXX")"
          archive="$install_directory/trivy.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/$asset" \
            --output "$archive"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$install_directory" trivy
          chmod 0755 "$install_directory/trivy"
          echo "$install_directory" >> "$GITHUB_PATH"

      - name: Gate the locally built image
        run: >-
          python -m scripts.scan_container_image ecn-operator-app:scan
          --report-directory "$CONTAINER_SCAN_REPORT_DIRECTORY"

      - name: Preserve complete image scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-image-scan
          path: |
            ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.scan.json
            ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: ${{ env.CONTAINER_SCAN_REPORT_DIRECTORY }}/image.sarif
          category: container-image-standalone

      - name: Generate SBOM with Trivy
        if: always()
        run: >-
          trivy convert --config /dev/null --ignorefile /dev/null --ignore-policy ''
          --format cyclonedx --output image-sbom.cdx.json
          "$CONTAINER_SCAN_REPORT_DIRECTORY/image.scan.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-sbom
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
