name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 6 * * 5'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish only from the public distribution repository, and only once
          # the cutover step that authorizes publication sets the opt-in
          # variable there. The byte-identical private copy never publishes.
          publish_results: >-
            ${{ github.repository == 'picogrid/ecn-sdk-python'
            && vars.SCORECARD_PUBLISH_ENABLED == 'true' }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: scorecard
