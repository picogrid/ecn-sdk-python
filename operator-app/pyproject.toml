[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "picogrid-ecn-operator-app"
version = "0.1.0" # x-release-please-version
description = "Browser operator view for authorized Picogrid ECN entity, location, and task workflows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "picogrid-ecn-client==0.1.0", # x-release-please-version
  "pydantic==2.13.4",
  "starlette==1.4.1",
  "uvicorn==0.52.1",
  "wsproto==1.3.2",
]

[project.scripts]
picogrid-ecn-operator = "operator_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.package-data]
operator_app = ["static/index.html", "static/assets/*", "static/brand/*"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["operator_app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["operator_app"]
mypy_path = "backend"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["ASYNC109", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
